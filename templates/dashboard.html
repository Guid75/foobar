<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Dashboard</title>
    <script src="https://unpkg.com/htmx.org"></script>
  </head>
  <body>
    <h1>Dashboard</h1>

    <p>You are logged in as {{ .User.Username }}.</p>

    <form method="post" action="/auth/logout">
      <button type="submit">Log out</button>
    </form>

    {{ if eq .User.Role "super_admin" }}
    <h2>Users</h2>
    <button hx-get="/users/new" hx-target="#user-form" hx-swap="innerHTML">
      Add user
    </button>

    <div id="user-form"></div>
    <table>
      <thead>
        <tr>
          <th>Username</th>
          <th>Role</th>
        </tr>
      </thead>
      <tbody id="user-list">
        {{ range .Users }}
        <tr>
          <td>{{ .Username }}</td>
          <td>{{ .Role }}</td>
        </tr>
        {{ end }}
      </tbody>
    </table>
    {{ end }}
  </body>
</html>
